name: Aggiorna statistiche BGG e pubblica

on:
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica partite da BGG
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python3 scripts/fetch_plays.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/plays.json
          git diff --cached --quiet || (git commit -m "Aggiorna partite BGG" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
